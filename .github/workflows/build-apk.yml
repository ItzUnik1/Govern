name: Build Android APK

# Start a build from your phone: GitHub app/website -> Actions -> "Build Android APK" -> Run workflow.
# It also runs automatically on every push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # The workflow commits download/GOVERN.apk itself; don't rebuild for that or for docs-only edits.
    paths-ignore: ['download/**', 'README.md', 'docs/**']

permissions:
  contents: write   # needed to publish the APK as a GitHub Release (a direct download link)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Phone-friendly upload path: if you uploaded the project as govern-project.zip, unpack it.
      - name: Unpack project zip (only if the repo contains just the zip)
        run: |
          if [ ! -f package.json ] && [ -f govern-project.zip ]; then
            unzip -o govern-project.zip -d .
          fi
          test -f package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub runners already ship the Android SDK; just accept its licences so Gradle can fetch platform 36.
      - name: Accept Android SDK licences
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type-check, run simulation tests and build the web bundle
        run: |
          npm run typecheck
          npx tsx scripts/simtest.ts trace uk idle > /dev/null
          GOVERN_BUILD=${{ github.run_number }} npm run build

      - name: Add Android platform if missing, then sync web bundle into it
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          GOVERN_BUILD=${{ github.run_number }} ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee /tmp/gradle.log
      - name: Show build errors
        if: failure()
        run: |
          grep -m12 -E "What went wrong|error:|Caused by|FAILED|Execution failed" -A3 /tmp/gradle.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/GOVERN-v${VERSION}-build${{ github.run_number }}-debug.apk"
          # Fixed file name -> permanent link: releases/latest/download/GOVERN.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk out/GOVERN.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: GOVERN-debug-apk
          path: out/*.apk

      - name: Publish as a GitHub Release (direct APK download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GOVERN build ${{ github.run_number }} (debug APK)
          body: |
            ${{ github.event.head_commit.message }}

            ---
            Debug-signed APK for Android 7+. Install over your old version to keep saves.
            Built from commit ${{ github.sha }}.
          prerelease: false
          make_latest: true
          files: out/*.apk

      - name: Keep the newest APK in the repo (download/GOVERN.apk)
        run: |
          mkdir -p download
          cp out/GOVERN.apk download/GOVERN.apk
          npx tsx scripts/syncdocs.ts   # refresh country lists and counts in README and the website
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/GOVERN.apk README.md docs/index.html
          if git diff --cached --quiet; then echo "APK unchanged"; else
            git commit -m "Update download/GOVERN.apk and generated docs (build ${{ github.run_number }}) [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
